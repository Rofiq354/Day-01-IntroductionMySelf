<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Minimalist Semantic</title>

    <!-- INTER FONT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Boostrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="/src/css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="/src/img/brand.png" alt="Ainur Rofiq" height="18" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarTogglerDemo02"
          aria-controls="navbarTogglerDemo02"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/page/project.html">My Project</a>
            </li>
          </ul>
          <button
            class="btn btn-primary"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#staticBackdrop"
          >
            Contact Me
          </button>
        </div>
      </div>
    </nav>

    <main
      class="shadow-lg container mt-5 card d-flex flex-coll flex-lg-row p-2 p-md-5"
    >
      <!-- INTRO CARD (Tetap di atas) -->
      <article class="card-body pe-lg-5">
        <header class="d-flex align-items-center gap-2">
          <a href="/index.html"><i class="fas fa-backward back-icon"></i></a>
          <h1>Contact Me</h1>
        </header>

        <section class="my-4">
          <div class="d-flex align-items-center mb-3">
            <div class="me-3 fs-4 text-primary">
              <i class="bi bi-telephone-fill"></i>
            </div>
            <div>
              <h6 class="mb-0">Phone</h6>
              <p class="mb-0 text-muted">+62 858-6031-0399</p>
            </div>
          </div>

          <div class="d-flex align-items-center mb-3">
            <div class="me-3 fs-4 text-danger">
              <i class="bi bi-envelope-fill"></i>
            </div>
            <div>
              <h6 class="mb-0">Email</h6>
              <p class="mb-0 text-muted">rofik010206@gmail.com</p>
            </div>
          </div>

          <div class="d-flex align-items-center mb-3">
            <div class="me-3 fs-4 text-success">
              <i class="bi bi-geo-alt-fill"></i>
            </div>
            <div>
              <h6 class="mb-0">Address</h6>
              <p class="mb-0 text-muted">Jl. Gunteng RT 04 RW 10, Indonesia</p>
            </div>
          </div>

          <div class="d-flex align-items-center mb-3">
            <div class="me-3 fs-4 text-info">
              <i class="bi bi-globe"></i>
            </div>
            <div>
              <h6 class="mb-0">Website</h6>
              <p class="mb-0 text-muted">
                <a href="https://ainur-rofiq-portfolio.netlify.app/"
                  >ainur-rofiq-portfolio.com</a
                >
              </p>
            </div>
          </div>
        </section>
      </article>
    </main>

    <!-- Modal Contact Me -->
    <div
      class="modal fade"
      id="staticBackdrop"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="staticBackdropLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable">
        <form class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="staticBackdropLabel">
              Modal title
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Nama Lengkap</label>
              <input
                type="text"
                class="form-control"
                placeholder="Masukkan nama kamu"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                placeholder="Email aktif"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Nomor HP</label>
              <input
                type="text"
                class="form-control"
                placeholder="Contoh: 0812xxxxxxx"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Subjek</label>
              <input
                type="text"
                class="form-control"
                placeholder="Judul pesan"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Pesan</label>
              <textarea
                class="form-control"
                rows="4"
                placeholder="Tulis pesan kamu di sini"
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="submit" class="btn btn-primary">Send</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
